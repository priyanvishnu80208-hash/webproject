<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deadpool Header</title>

  <style>
   

    body{
      width: 100%;
     min-height:  800px;

      background-image: url("deadpool-sipping-boba-tea-in-neon-arcade-anime-desktop-wallpaper.jpg");


      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .marvel{
      padding-left: 700px ;
      display: flex;
      
      
      margin-right: 15px;
      
    }
    nav{
      word-spacing: 180%;
      font-size: 20px;
       position: relative;
      left: 400px;
      margin-top: 100px;
       
    }
    a {
     
      
      
     
      
      text-decoration: none;
      color: khaki;
      
    }
    .search {
      margin-left: 200px;
      margin-top: 200px;

    }
    input{
      width: 400px;
      height: 50px;
      font-size: 40px;
      border-radius: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <div class="marvel">
      <nav>
      <a href="#Home ">HOME</a>
      <a href="#About ">About</a>
      <a href="#Mission ">Mission</a>
      <a href="#Contact ">Contact</a>
      </nav>
    </div>
    <div class="search">
      <input type="search" placeholder="search">
    </div>
  </header>

</body>
</html>
